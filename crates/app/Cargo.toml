[package]
name = "fogu"
edition.workspace = true
license.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
fogu-core = { path = "../core" }
fogu-ui = { path = "../ui", default-features = false }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
clap = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[features]
default = ["ssh", "bell-sound"]
# SSH sessions (forwards `fogu-ui/ssh`).
ssh = ["fogu-ui/ssh"]
# The terminal bell's sound (forwards `fogu-ui/bell-sound`).
bell-sound = ["fogu-ui/bell-sound"]
