[package]
name = "fogu-ui"
edition.workspace = true
license.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
fogu-session = { path = "../session", default-features = false }
iced = { workspace = true }
tiny-skia = { workspace = true }
image.workspace = true
fogu-core = { path = "../core" }
fogu-term = { path = "../term" }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
rfd.workspace = true
open.workspace = true
dirs.workspace = true
tokio.workspace = true
tracing.workspace = true
rodio = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true

[features]
default = ["ssh", "bell-sound"]
# SSH sessions (forwards `fogu-session/ssh`).
ssh = ["fogu-session/ssh"]
# The terminal bell's sound (rodio; ALSA headers on Linux).
bell-sound = ["dep:rodio"]
