[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/term",
    "crates/session",
    "crates/ui",
    "crates/app",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
# why: the GUI toolkit. Pinned to the exact
# patch (only 0.14.0 exists on crates.io as of this writing) because iced breaks between minors.
# `wgpu`/`tiny-skia` are already iced's default features; listed explicitly so
# the renderer choice is visible here instead of relying on upstream defaults. No `tokio` feature:
# iced::application uses its own default executor (iced_futures::backend::default::Executor)
# regardless of this feature; add it only if iced ever needs to drive a tokio runtime.
iced = { version = "=0.14.0", features = ["wgpu", "tiny-skia"] }
# why: structured logging, used by `fogu`'s main().
tracing = "0.1.44"
# why: tracing subscriber with env-filter so `RUST_LOG` controls verbosity.
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
indexing_slicing = "warn"
undocumented_unsafe_blocks = "deny"
# pedantic noise we accept:
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"
debug = false

[profile.release-dev]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = "none"
debug = "line-tables-only"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
