[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/term",
    "crates/session",
    "crates/ui",
    "crates/app",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
# why: the GUI toolkit. Pinned to the exact
# patch (only 0.14.0 exists on crates.io as of this writing) because iced breaks between minors.
# `wgpu`/`tiny-skia` are already iced's default features; listed explicitly so
# the renderer choice is visible here instead of relying on upstream defaults. No `tokio` feature:
# iced::application uses its own default executor (iced_futures::backend::default::Executor)
# regardless of this feature; add it only if iced ever needs to drive a tokio runtime.
# `advanced`: the custom `Widget` trait, `fill_quad`/`fill_text` and the cosmic-text/fontdb
# re-exports the terminal widget draws and measures with.
iced = { version = "=0.14.0", features = ["wgpu", "tiny-skia", "advanced"] }
# why: structured logging, used by `fogu`'s main().
tracing = "0.1.44"
# why: tracing subscriber with env-filter so `RUST_LOG` controls verbosity; `tracing-log` (a default
# feature, listed explicitly) is the `log` -> tracing bridge for dependencies, so no direct
# `tracing-log` dependency is needed.
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "tracing-log"] }
# why: non-blocking daily-rotated log file in $XDG_STATE_HOME/fogu.
tracing-appender = "0.2.5"
# why: async runtime for session tasks; multi-thread rt, mpsc, child
# process wait, timers, `select!`.
tokio = { version = "1.53.2", features = ["rt-multi-thread", "sync", "process", "io-util", "time", "macros"] }
# why: tokio-native PTY open/spawn/resize without unsafe in our code.
pty-process = { version = "0.5.3", features = ["async"] }
# why: safe `dup`, `tcsetwinsize`, `getuid` and process-group SIGKILL; already in the
# tree via pty-process.
rustix = { version = "1.1.5", features = ["termios", "process", "fs"] }
# why: cheap shareable byte buffers for `SessionInput::Data` and the pending-write queue.
bytes = "1.12.1"
# why: one error enum per library domain (`SessionError`).
thiserror = "2.0.21"
# why: the VT engine (parser, grid, scrollback, reflow): mature, maintained, used by Alacritty.
alacritty_terminal = "0.26.0"
# why: snapshot tests of grid state (dev-dependency only).
insta = "1.49.0"
# why: `Config`/`Profile`/`ColorScheme` (de)serialisation; `derive` only, no
# other feature needed.
serde = { version = "1.0.229", features = ["derive"] }
# why: native config file format: human-editable, comments allowed, no YAML
# type-coercion surprises.
toml = "1.1.8"
# why: `$XDG_CONFIG_HOME/fogu` path. Chose `xdg` over
# `directories`: this is a Linux-only app, so `directories`' macOS/Windows path
# logic is dead code we would carry for nothing; `xdg` is the smaller, Linux-specific crate for
# exactly the XDG Base Directory spec we need.
xdg = "3.0.0"

# why: command-line flags (`--config-dir`, `--software-render`, `--version`).
# `derive` keeps the flag definitions declarative; default features (help, usage, errors) only.
clap = { version = "4.6.7", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
indexing_slicing = "warn"
undocumented_unsafe_blocks = "deny"
# pedantic noise we accept:
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"
debug = false

[profile.release-dev]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = "none"
debug = "line-tables-only"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
